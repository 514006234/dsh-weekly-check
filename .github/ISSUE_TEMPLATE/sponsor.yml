name: 我要赞助榜单位
description: 申请《DSH 插件周榜》的赞助推荐位（主推标准月价 ¥99 / 月，含 4 期周报 + 4 个永久收录位；创始赞助价 ¥99 / 年，限量 3 席）
title: "[赞助] "
body:
  - type: markdown
    attributes:
      value: |
        感谢支持。填完下面几项就行，**不要填任何密钥、账号、隐私信息**。
        我们会在一个工作日内回复，先确认位置与档位，确认后再付款。

        **「一期」= 一次周报推送（每周一期）**；赞助位自下一期周报发布起展示，并**永久收录**在该期页面里（该期页面不会删除，无需续费也不会下架）。
        对外报价优先说「月」：**¥99/月（含 4 期周报 + 4 个永久收录位）**，折合 ¥24.75/期；按「期」下单也可以，但报价口径统一用月。
        榜单排名**永远按 GitHub 真实 star 数排**，赞助位单独标注「赞助」，**不卖榜一、不卖排名**；赞助位与榜单分开呈现，不影响任何排序。
        浏览量数据在周报「影响力与流量」栏目公开（GitHub 真实数据）；**当前流量很小，这一点会如实写在页面上**，我们不会为了标价抬高流量数字。
        赞助政策：你给 1 行中文推荐语（≤40 字）+ 1 个链接，由我们核实后撰写或调整；交付位置是当期周报顶部「本期推荐（赞助）」卡片 + 榜内置顶标记。
        **首次合作全额退款**：付款后 7 天内、且在下一期周报发布前，随时可全额退款，不需要理由。

  - type: input
    id: repo
    attributes:
      label: 插件仓库地址
      description: 例如 https://github.com/owner/repo
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: 插件中文名
      description: 榜单上要显示的名字（没有的话我们帮你起一个）
      placeholder: 例如：侧边栏文件树
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: 想要的档位（「一期」= 一次周报推送；赞助位永久收录）
      description: 对外报价优先说「月」（标准月价 ¥99 / 月 = 4 期 + 4 个永久收录位，主推）；按「期」下单也可以
      options:
        - 创始赞助价（¥99 / 年，52 期赞助位 + 52 个永久收录位，限量 3 席，需允许写成公开案例）
        - 标准月价（¥99 / 月，4 期赞助位 + 4 个永久收录位，主推）
        - 季度（¥279，13 期赞助位 + 13 个永久收录位，约 3 个月）
        - 年度（¥999，52 期赞助位 + 52 个永久收录位）
        - 独家一期（¥299 / 期，该期唯一赞助位 + 永久收录）
        - 还不确定，先聊聊
    validations:
      required: true

  - type: textarea
    id: oneline
    attributes:
      label: 一句话说明这个插件解决什么问题
      description: 中文，尽量具体；我们会核实后改写，不接受夸张或无法验证的描述
      placeholder: 例如：在侧边栏直接看文件树并打开文件，不用切到编辑器
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 邮箱或微信号，用于确认档位和交付时间
    validations:
      required: true

  - type: checkboxes
    id: agree
    attributes:
      label: 确认
      options:
        - label: 我理解赞助是「额外标注的推荐位」，榜单排序仍按真实星数，不会因为赞助改排名
          required: true
