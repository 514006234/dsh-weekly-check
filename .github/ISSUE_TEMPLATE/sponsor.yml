name: 我要赞助榜单位
description: 申请《DSH 插件周榜》的赞助推荐位（创始赞助价 ¥99/期 起，主推 4 期打包 ¥599，对外可报 ¥599/月）
title: "[赞助] "
body:
  - type: markdown
    attributes:
      value: |
        感谢支持。填完下面几项就行，**不要填任何密钥、账号、隐私信息**。
        我们会在一个工作日内回复，先确认位置与档位，确认后再付款。

        **「一期」= 一次周报推送**（每周一期，7 天节奏）；赞助位**永久收录**在该期页面里，页面不会删除。
        对外报价优先说月：**¥599/月**（含 4 期周报 + 4 个永久收录位）。
        档位按「周报单期真实浏览量」启用；榜单排名**永远按 GitHub 真实 star 数排**，赞助位单独标注「赞助」，**不卖排名**。浏览量数据在周报「影响力与流量」栏目公开。

  - type: input
    id: repo
    attributes:
      label: 插件仓库地址
      description: 例如 https://github.com/owner/repo
      placeholder: https://github.com/owner/repo
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: 插件中文名
      description: 榜单上要显示的名字（没有的话我们帮你起一个）
      placeholder: 例如：侧边栏文件树
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: 想要的档位（「一期」= 一次周报推送；赞助位永久收录）
      description: 档位按周报单期真实浏览量启用（小于 500 创始价 / 500–999 常规 / 1000 以上标准 / 2000 以上进阶）；4 期打包、独家、季度、年度不限流量
      options:
        - 创始赞助价（¥99 / 期，限量 3 席，当前就是这一档）
        - 常规单期（¥199 / 期，单期浏览量 500–999）
        - 标准单期（¥299 / 期，单期浏览量 1000 以上）
        - 进阶单期（¥599 / 期，单期浏览量 2000 以上，首屏）
        - 4 期打包（¥599，合 ¥149.75/期，主推）
        - 独家一期（¥1,199 / 期，该期唯一赞助位）
        - 季度 13 期（¥1,799）
        - 年度 52 期（¥4,999，仅限老客户）
        - 还不确定，先聊聊
    validations:
      required: true

  - type: textarea
    id: oneline
    attributes:
      label: 一句话说明这个插件解决什么问题
      description: 中文，尽量具体；我们会核实后改写，不接受夸张或无法验证的描述
      placeholder: 例如：在侧边栏直接看文件树并打开文件，不用切到编辑器
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 邮箱或微信号，用于确认档位和交付时间
    validations:
      required: true

  - type: checkboxes
    id: agree
    attributes:
      label: 确认
      options:
        - label: 我理解赞助是「额外标注的推荐位」，榜单排序仍按真实星数，不会因为赞助改排名
          required: true
